<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面试搭子 · 一键组队</title>
  <meta name="description" content="粘贴腾讯会议 / 飞书会议链接，一键生成面试搭子匹配页，按岗位 / 城市 / 时间找同伴组队练面试。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e88e5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='system-ui' font-size='30' font-weight='800' fill='white'%3E搭%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container bar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">搭</span>
        <span class="brand-text">面试搭子</span>
      </a>
      <div class="bar-right">
        <a class="brand-back" id="ctx-back" href="https://955827.xyz" hidden>← 返回</a>
        <span class="brand-tag">MVP · 纯前端</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">一键组队练面试</p>
      <h1>粘贴会议链接<br />生成你的面试搭子页</h1>
      <p class="lede">把腾讯会议 / 飞书会议链接贴进来，填一下岗位、城市、可约时间，立刻得到一张<strong>可分享的匹配页</strong>。发给备考同伴，点开就能一键入会组队互练。</p>
    </section>

    <!-- 生成器 -->
    <section class="card form-card">
      <form id="gen-form" autocomplete="off">
        <label class="field">
          <span class="field-label">会议链接 <em>*</em></span>
          <input id="meeting" type="text" inputmode="url" placeholder="https://meeting.tencent.com/dm/xxxx 或 https://vc.feishu.cn/j/xxxx" />
          <span class="field-hint" id="meeting-hint">支持腾讯会议 / 飞书会议链接</span>
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">岗位</span>
            <select id="role">
              <option value="辅警">辅警 / 民辅警</option>
              <option value="消防员">专职 / 政府消防员</option>
              <option value="公务员">公务员 / 省考 / 国考</option>
              <option value="事业单位">事业单位</option>
              <option value="教师">教师招考</option>
              <option value="其他">其他</option>
            </select>
            <span class="field-hint" id="role-hint"></span>
          </label>
          <label class="field">
            <span class="field-label">城市</span>
            <input id="city" type="text" placeholder="如：深圳 / 武汉" />
          </label>
        </div>

        <label class="field">
          <span class="field-label">可约时间</span>
          <input id="time" type="text" placeholder="如：每晚 20:00–22:00 / 周末全天" />
        </label>

        <label class="field">
          <span class="field-label">开练时间（选填）</span>
          <input id="when" type="datetime-local" />
          <span class="field-hint">填了可生成倒计时与「添加到日历」提醒，不填也能正常用</span>
        </label>

        <div class="field-row">
          <label class="field">
            <span class="field-label">联系方式类型</span>
            <select id="contactType">
              <option value="微信">微信</option>
              <option value="QQ">QQ</option>
              <option value="手机号">手机号</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">联系方式</span>
            <input id="contact" type="text" placeholder="如：RCJ9527" />
          </label>
        </div>

        <label class="field">
          <span class="field-label">备注（选填）</span>
          <textarea id="note" rows="2" placeholder="如：专练结构化面试 / 互相点评 / 模拟无领导"></textarea>
        </label>

        <button type="submit" class="btn-primary">生成面试搭子页 →</button>
      </form>

      <!-- 结果 -->
      <div id="result" class="result" hidden>
        <p class="result-title">✅ 你的专属页已生成</p>
        <p class="result-desc">复制下面的链接发出去，同伴点开即可一键入会：</p>
        <div class="result-row">
          <input id="result-url" type="text" readonly />
          <button id="copy-btn" type="button" class="btn-copy">复制</button>
        </div>
        <a id="preview-link" class="result-preview" href="#" target="_blank" rel="noopener">预览匹配页 ↗</a>
      </div>
    </section>

    <p class="foot-note">MVP 为纯前端演示：数据编码在链接里，不发任何服务器。真正的「智能匹配 + 后台撮合」将在独立产品版实现。</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="muted">面试搭子 · RCJ9527 · 纯静态原型</p>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
</body>
</html>
