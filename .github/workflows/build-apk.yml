name: Build FaceTalk APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: FaceTalk APK 构建 #${{ github.run_number }}
          body: |
            自动构建的 FaceTalk 调试版 APK（来自 mianshi-dazi 仓库）。

            安装：安卓手机开启「允许未知来源」后直接安装此 APK。
            当前为调试签名，仅供内测分发；正式上架应用商店需后续替换为发布签名密钥。

            用法：打开 App → 发腾讯会议室 / 留言 → 别人同岗同城可见，点「一键入会」跳腾讯会议 App 连麦。
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
